spring.application.name=stocksense-bd

# Manage Docker containers manually (docker-compose up -d). The app must NOT start/stop containers,
# otherwise an app crash tears down MySQL/Redis/RabbitMQ. Bring infra up before running the app.
spring.docker.compose.enabled=false

# MySQL (primary DB)
spring.datasource.url=jdbc:mysql://localhost:3306/stocksense?createDatabaseIfNotExist=true&serverTimezone=Asia/Dhaka&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=stocksense
spring.datasource.password=stocksense
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# JWT
app.jwt.secret=${JWT_SECRET:stocksense-dev-secret-key-minimum-32-characters}
app.jwt.expiration-ms=86400000

# Anthropic / AI agent layer (Phase 3+). API key MUST come from the environment.
app.anthropic.enabled=true
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
app.anthropic.max-tokens=4096
app.anthropic.timeout-seconds=120
app.anthropic.max-tool-iterations=8

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS (Angular dev server)
app.cors.allowed-origins=http://localhost:4200
